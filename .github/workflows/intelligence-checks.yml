name: Intelligence Layer Checks
on:
  push:
    branches:
      - feature/evidence-intelligence-layer
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Test recommendation and roadmap logic
        run: npm test -- --run src/lib/evidence-intelligence.test.ts src/test/rules.test.ts
      - name: Build app
        run: npm run build
