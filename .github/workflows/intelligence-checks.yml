name: Intelligence Layer Checks
on:
  push:
    branches:
      - feature/evidence-intelligence-layer
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-save
      - name: Test recommendation and roadmap logic
        run: bunx vitest run src/lib/evidence-intelligence.test.ts src/lib/submission-evidence.test.ts src/test/rules.test.ts
      - name: Build app
        run: bun run build
