name: Standalone MCP checks
on:
  push:
    branches: [feature/evidence-intelligence-layer]
    paths: ['mcp-worker/**', 'src/lib/**', 'data/**', '.github/workflows/mcp-worker-checks.yml']
  pull_request:
    paths: ['mcp-worker/**', 'src/lib/**', 'data/**', '.github/workflows/mcp-worker-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mcp-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
